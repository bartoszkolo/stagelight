# Builds the Stagelight desktop app for Windows, macOS (Apple Silicon + Intel) and Linux.
# Push a tag like v0.1.0 to publish a GitHub Release with the installers; run it manually
# (Actions → Desktop app → Run workflow) to just get the files as build artifacts.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_VERSION: "0.13.2"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            uv: uv-x86_64-pc-windows-msvc.zip
            args: --win --x64
          # No Intel Mac build: PyTorch stopped shipping x86_64 macOS wheels, so the engine can't install there.
          - name: macOS Apple Silicon
            os: macos-14
            uv: uv-aarch64-apple-darwin.tar.gz
            args: --mac --arm64
          - name: Linux x64
            os: ubuntu-latest
            uv: uv-x86_64-unknown-linux-gnu.tar.gz
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Fetch uv for the target platform
        run: |
          mkdir -p vendor/uv && cd vendor/uv
          curl -fsSL -o pkg "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/${{ matrix.uv }}"
          if [[ "${{ matrix.uv }}" == *.zip ]]; then unzip -q pkg; else tar -xzf pkg --strip-components=1; fi
          rm pkg
          ls -la

      - run: npm ci

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No paid code-signing certificate: builds are unsigned (see README for the first-launch prompt).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: Stagelight-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            !desktop/dist/*__uninstaller*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
